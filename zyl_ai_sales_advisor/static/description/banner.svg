<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Main gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2444"/>
      <stop offset="55%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#2563EB"/>
    </linearGradient>
    <!-- Accent glow -->
    <radialGradient id="glow" cx="75%" cy="50%" r="40%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#0f2444;stop-opacity:0"/>
    </radialGradient>
    <!-- Card gradient -->
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.12)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.04)"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#glow)"/>

  <!-- Decorative circles -->
  <circle cx="960" cy="-40" r="220" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  <circle cx="960" cy="-40" r="170" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
  <circle cx="1160" cy="420" r="180" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>
  <circle cx="60" cy="380" r="140" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1.5"/>

  <!-- Grid lines (subtle) -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
  </g>

  <!-- Left content block -->
  <!-- Logo / icon circle -->
  <circle cx="80" cy="90" r="36" fill="rgba(255,255,255,0.12)"/>
  <text x="80" y="100" text-anchor="middle" font-size="30" fill="white">🤖</text>

  <!-- Company name -->
  <text x="128" y="82" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600"
        letter-spacing="2" fill="rgba(255,255,255,0.55)" text-anchor="start">ZYLENTOR ERP SOLUTIONS</text>
  <text x="128" y="104" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="rgba(96,165,250,0.85)" text-anchor="start">OPL-1  •  v19.0.1.1.0</text>

  <!-- Main headline -->
  <text x="64" y="178" font-family="'Segoe UI',Arial,sans-serif" font-size="52" font-weight="800"
        fill="white" text-anchor="start" filter="url(#shadow)">AI Sales Advisor</text>
  <text x="66" y="216" font-family="'Segoe UI',Arial,sans-serif" font-size="19" font-weight="400"
        fill="rgba(255,255,255,0.78)" text-anchor="start">Intelligence &amp; Analytics for Your Sales Team</text>

  <!-- Tagline -->
  <text x="66" y="256" font-family="'Segoe UI',Arial,sans-serif" font-size="14.5"
        fill="rgba(147,197,253,0.9)" text-anchor="start">
    Chat with your data  ·  Seasonal trends  ·  AI-generated insights  ·  Live dashboards
  </text>

  <!-- Badges -->
  <rect x="66" y="284" width="96" height="28" rx="14" fill="rgba(37,99,235,0.75)" stroke="rgba(147,197,253,0.4)" stroke-width="1"/>
  <text x="114" y="302" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700"
        fill="white" text-anchor="middle">Gemini 2.5</text>

  <rect x="172" y="284" width="80" height="28" rx="14" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <text x="212" y="302" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700"
        fill="white" text-anchor="middle">GPT-4o</text>

  <rect x="262" y="284" width="104" height="28" rx="14" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <text x="314" y="302" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700"
        fill="white" text-anchor="middle">Claude 3.5</text>



  <!-- Support email -->
  <text x="66" y="356" font-family="'Segoe UI',Arial,sans-serif" font-size="13"
        fill="rgba(255,255,255,0.45)" text-anchor="start">📧  supportzylentorerpsolution@gmail.com</text>

  <!-- Divider line -->
  <line x1="640" y1="40" x2="640" y2="360" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Right side — KPI mini cards -->
  <!-- Card 1 -->
  <rect x="668" y="48" width="158" height="90" rx="14" fill="url(#card)" stroke="rgba(255,255,255,0.12)" stroke-width="1" filter="url(#shadow)"/>
  <text x="686" y="80" font-family="'Segoe UI',Arial,sans-serif" font-size="26" fill="white" font-weight="700">$2.0M</text>
  <text x="686" y="100" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="rgba(255,255,255,0.55)">Total Revenue</text>
  <text x="686" y="124" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#6ee7b7" font-weight="600">▲ 59.9% growth</text>

  <!-- Card 2 -->
  <rect x="840" y="48" width="158" height="90" rx="14" fill="url(#card)" stroke="rgba(255,255,255,0.12)" stroke-width="1" filter="url(#shadow)"/>
  <text x="858" y="80" font-family="'Segoe UI',Arial,sans-serif" font-size="26" fill="white" font-weight="700">155</text>
  <text x="858" y="100" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="rgba(255,255,255,0.55)">Total Orders</text>
  <text x="858" y="124" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#93c5fd" font-weight="600">Last 12 months</text>

  <!-- Card 3 -->
  <rect x="1012" y="48" width="158" height="90" rx="14" fill="url(#card)" stroke="rgba(255,255,255,0.12)" stroke-width="1" filter="url(#shadow)"/>
  <text x="1030" y="80" font-family="'Segoe UI',Arial,sans-serif" font-size="26" fill="white" font-weight="700">$12.9K</text>
  <text x="1030" y="100" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="rgba(255,255,255,0.55)">Avg Order Value</text>
  <text x="1030" y="124" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#93c5fd" font-weight="600">Per transaction</text>

  <!-- Mini bar chart mockup -->
  <rect x="668" y="158" width="502" height="140" rx="14" fill="url(#card)" stroke="rgba(255,255,255,0.10)" stroke-width="1" filter="url(#shadow)"/>
  <text x="684" y="180" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="rgba(255,255,255,0.55)" font-weight="600">📊  MONTHLY REVENUE TREND</text>

  <!-- Chart bars (decorative) -->
  <g>
    <rect x="690" y="258" width="22" height="22" rx="3" fill="rgba(96,165,250,0.6)"/>
    <rect x="718" y="244" width="22" height="36" rx="3" fill="rgba(96,165,250,0.7)"/>
    <rect x="746" y="218" width="22" height="62" rx="3" fill="rgba(96,165,250,0.8)"/>
    <rect x="774" y="238" width="22" height="42" rx="3" fill="rgba(96,165,250,0.7)"/>
    <rect x="802" y="252" width="22" height="28" rx="3" fill="rgba(96,165,250,0.6)"/>
    <rect x="830" y="200" width="22" height="80" rx="3" fill="rgba(59,130,246,0.9)"/>
    <rect x="858" y="194" width="22" height="86" rx="3" fill="#3b82f6"/>
    <rect x="886" y="210" width="22" height="70" rx="3" fill="rgba(59,130,246,0.85)"/>
    <rect x="914" y="228" width="22" height="52" rx="3" fill="rgba(96,165,250,0.7)"/>
    <rect x="942" y="215" width="22" height="65" rx="3" fill="rgba(96,165,250,0.75)"/>
    <rect x="970" y="196" width="22" height="84" rx="3" fill="#3b82f6"/>
    <rect x="998" y="188" width="22" height="92" rx="3" fill="rgba(37,99,235,0.95)"/>
    <rect x="1026" y="230" width="22" height="50" rx="3" fill="rgba(96,165,250,0.65)"/>
    <rect x="1054" y="245" width="22" height="35" rx="3" fill="rgba(96,165,250,0.6)"/>
    <rect x="1082" y="215" width="22" height="65" rx="3" fill="rgba(96,165,250,0.7)"/>
    <rect x="1110" y="205" width="22" height="75" rx="3" fill="rgba(59,130,246,0.8)"/>
    <!-- Trend line -->
    <polyline points="701,258 729,240 757,220 785,240 813,252 841,198 869,192 897,208 925,230 953,213 981,195 1009,187 1037,228 1065,244 1093,214 1121,204"
              fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-dasharray="4,2"/>
  </g>

  <!-- Bottom features strip -->
  <rect x="668" y="310" width="502" height="68" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="684" y="330" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="rgba(255,255,255,0.55)" font-weight="700" letter-spacing="1">FEATURES</text>
  <text x="684" y="349" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="rgba(255,255,255,0.80)">💬 AI Chat  ·  📈 Revenue Trends  ·  🏆 Top Products  ·  🌿 Seasonal Intel</text>
  <text x="684" y="368" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="rgba(255,255,255,0.80)">🔮 Forecasting  ·  📋 Saved Insights  ·  ↔️ Resizable Chat  ·  ⚙️ Config</text>
</svg>
